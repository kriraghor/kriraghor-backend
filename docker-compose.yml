name: kriraghor

# Local dependencies only (the app runs on the host with npm run dev). Image versions are pinned.
services:
  mysql:
    image: mysql:8.4
    container_name: kriraghor-mysql
    environment:
      MYSQL_DATABASE: kriraghor
      MYSQL_USER: kriraghor
      MYSQL_PASSWORD: kriraghor
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  # BullMQ queues, rate limits and the Socket.IO adapter
  redis:
    image: redis:7.4-alpine
    container_name: kriraghor-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: kriraghor-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      retries: 10

  # S3-compatible object storage (stands in for R2 or S3). MinIO stopped publishing images in 2025.
  s3:
    image: chrislusf/seaweedfs:4.01
    container_name: kriraghor-s3
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256"]
    ports:
      - "8333:8333"   # S3 API: http://127.0.0.1:8333
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 10s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  s3-data:
