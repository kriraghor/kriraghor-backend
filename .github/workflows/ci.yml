name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kriraghor_test
          POSTGRES_USER: kriraghor
          POSTGRES_PASSWORD: kriraghor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        env:
          DATABASE_URL: postgres://kriraghor:kriraghor@127.0.0.1:5432/kriraghor_test
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_123456789
          JWT_SPECIAL_SECRET: test_jwt_special_secret_key_123456789
          DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          OTP_HASH_SECRET: test_otp_hash_secret_key_123456789
        run: npm test
